<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 23시까지 남은 시간 타이머</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    label {
      font-size: 0.9rem;
      color: #666;
      font-weight: 600;
    }

    input[type="datetime-local"] {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="datetime-local"]:focus {
      border-color: #4f46e5;
    }

    .timer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .time-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px 5px;
    }

    .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #4f46e5;
      display: block;
    }

    .unit {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }

    .status-message {
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 600;
      color: #ef4444;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>⏳ 목표 시간까지 남은 시간</h1>

    <div class="input-group">
      <label for="target-datetime">목표 날짜 및 시간 선택</label>
      <input type="datetime-local" id="target-datetime">
    </div>

    <div class="timer-container">
      <div class="time-box">
        <span class="number" id="days">0</span>
        <span class="unit">일</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">0</span>
        <span class="unit">시간</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">0</span>
        <span class="unit">분</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">0</span>
        <span class="unit">초</span>
      </div>
    </div>

    <div class="status-message" id="status"></div>
  </div>

  <script>
    const inputElement = document.getElementById('target-datetime');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const statusEl = document.getElementById('status');

    let timerInterval = null;

    // 변경된 부분: 기본값을 '오늘 23:00:00'으로 설정
    function setDefaultTarget() {
      const today = new Date();
      today.setHours(23, 0, 0, 0); // 시간을 오늘 밤 23시로 설정

      // 만약 이미 밤 23시가 넘었다면 자동으로 '내일 23시'로 지정
      if (new Date().getTime() > today.getTime()) {
        today.setDate(today.getDate() + 1);
      }

      // datetime-local 포맷에 맞춰 변환 (YYYY-MM-DDTHH:mm)
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const hours = String(today.getHours()).padStart(2, '0');
      const minutes = String(today.getMinutes()).padStart(2, '0');

      inputElement.value = `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // 시간 계산 및 업데이트 함수
    function updateTimer() {
      const targetTime = new Date(inputElement.value).getTime();
      const currentTime = new Date().getTime();

      if (isNaN(targetTime)) {
        statusEl.textContent = "올바른 날짜와 시간을 선택해주세요.";
        resetTimer();
        return;
      }

      const diff = targetTime - currentTime;

      if (diff <= 0) {
        statusEl.textContent = "🎉 목표 시간이 도달했습니다!";
        resetTimer();
        clearInterval(timerInterval);
        return;
      } else {
        statusEl.textContent = "";
      }

      // 시간 단위 계산 (밀리초 기준)
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      daysEl.textContent = days;
      hoursEl.textContent = hours;
      minutesEl.textContent = minutes;
      secondsEl.textContent = seconds;
    }

    function resetTimer() {
      daysEl.textContent = "0";
      hoursEl.textContent = "0";
      minutesEl.textContent = "0";
      secondsEl.textContent = "0";
    }

    // 초기 실행
    setDefaultTarget();
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);

    // 사용자가 날짜/시간 변경 시 재계산
    inputElement.addEventListener('change', () => {
      clearInterval(timerInterval);
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    });
  </script>
</body>
</html>
